agents:
  queue: "macos"

steps:
  - label: "Append Full Unity 2022 Pipeline"
    depends_on: "build-unitypackage"
    timeout_in_minutes: 2
    commands:
        - "buildkite-agent pipeline upload .buildkite/unity.2022.full.yml"

  - label: "Append Unity 6000 Pipeline"
    depends_on: "build-unitypackage"
    timeout_in_minutes: 2
    commands:
      - "buildkite-agent pipeline upload .buildkite/unity.6000.yml"
