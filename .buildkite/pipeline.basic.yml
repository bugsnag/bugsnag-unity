aliases:
  - &2021 "2021.3.45f2"

agents:
  queue: "macos-15"

steps:

  - label: "Verify code formatting"
    timeout_in_minutes: 5
    env:
      UNITY_VERSION: *2021
    plugins:
      artifacts#v1.9.0:
        upload:
          - "Bugsnag/Library/Logs/*.log"
    commands:
      - "rake code:verify"

  - label: "Run Unit Tests"
    timeout_in_minutes: 5
    env:
      UNITY_VERSION: *2021
    commands:
      - "rake test:run_editor_unit_tests"
      - |
        set +e
        SUMMARY="coverage/Report/Summary.xml"
        if [ ! -f "$$SUMMARY" ]; then echo "No coverage summary found, skipping"; exit 0; fi

        LINE=$$(sed -n 's/.*<Linecoverage>\([^<]*\).*/\1/p' "$$SUMMARY" | head -1)
        METHOD=$$(sed -n 's/.*<Methodcoverage>\([^<]*\).*/\1/p' "$$SUMMARY" | head -1)
        LINE=$${LINE:-N/A}
        METHOD=$${METHOD:-N/A}
        echo "Coverage: Line=$${LINE}% Methods=$${METHOD}%"

        # Buildkite annotation
        buildkite-agent annotate --style info --context coverage \
          "**Unit test coverage** — Line: $${LINE}% | Methods: $${METHOD}%" || true

        # Post a sticky PR comment on GitHub if this is a pull request
        echo "BUILDKITE_PULL_REQUEST=$$BUILDKITE_PULL_REQUEST"
        if [ -z "$$BUILDKITE_PULL_REQUEST" ] || [ "$$BUILDKITE_PULL_REQUEST" = "false" ]; then
          echo "Not a pull request, skipping PR comment"
          exit 0
        fi

        REPO="$$BUILDKITE_REPO"
        REPO=$$(echo "$$REPO" | sed 's|https://github.com/||' | sed 's|git@github.com:||' | sed 's|\.git$$||')
        PR="$$BUILDKITE_PULL_REQUEST"
        echo "Posting comment to repo=$${REPO} PR=$${PR}"

        MARKER="<!-- unit-test-coverage -->"
        BODY=$$(printf '%s\n## :bar_chart: Unit Test Coverage\n\n| Lines | Methods |\n|-------|---------|\n| %s%% | %s%% |' \
          "$$MARKER" "$$LINE" "$$METHOD")

        # Find existing comment with our marker
        COMMENT_ID=$$(curl -s \
          -H "Authorization: token $$DANGER_GITHUB_API_TOKEN" \
          -H "Accept: application/vnd.github+json" \
          "https://api.github.com/repos/$${REPO}/issues/$${PR}/comments" \
          | python3 -c 'import json,sys; comments=json.load(sys.stdin); print(next((str(c["id"]) for c in comments if c.get("body","").startswith("<!-- unit-test-coverage -->")), ""))' 2>/dev/null)
        echo "Existing comment ID: '$${COMMENT_ID}'"

        JSON_BODY=$$(python3 -c 'import json,sys; print(json.dumps({"body": sys.argv[1]}))' "$$BODY")

        if [ -n "$$COMMENT_ID" ]; then
          echo "Updating existing comment $${COMMENT_ID}"
          curl -s -X PATCH \
            -H "Authorization: token $$DANGER_GITHUB_API_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$${REPO}/issues/comments/$${COMMENT_ID}" \
            -d "$$JSON_BODY"
        else
          echo "Creating new comment"
          curl -s -X POST \
            -H "Authorization: token $$DANGER_GITHUB_API_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$${REPO}/issues/$${PR}/comments" \
            -d "$$JSON_BODY"
        fi
        echo "Done"
    artifact_paths:
      - "testResults.xml"

  - label: "Build released notifier artifact"
    key: "build-unitypackage"
    timeout_in_minutes: 30
    env:
      UNITY_VERSION: *2021
      JAVA_VERSION: "17"
    commands:
      - "bundle install"
      - "bundle exec rake plugin:export"
      - "zip -r upm-package.zip upm-package"
      - "zip -r upm-edm4u-package.zip upm-edm4u-package"
    artifact_paths:
      - "Bugsnag.unitypackage"
      - "upm-package.zip"
      - "upm-edm4u-package.zip"
    retry:
      automatic:
        - exit_status: "*"
          limit: 1
    concurrency: 5
    concurrency_method: "eager"
    concurrency_group: "unity-floating"

  - label: "Test UPM Package Import"
    depends_on: "build-unitypackage"
    timeout_in_minutes: 10
    env:
      UNITY_VERSION: *2021
    key: "import-upm-2021"
    plugins:
      artifacts#v1.9.0:
        download:
          - "upm-package.zip"
        upload:
          - "upm-import.log"
    commands:
      - "features/scripts/test_upm_package_import.sh"
    concurrency: 5
    concurrency_method: "eager"
    concurrency_group: "unity-floating"

  - label: "Run size impact reporting"
    depends_on: "build-unitypackage"
    timeout_in_minutes: 30
    env:
      UNITY_VERSION: *2021
    plugins:
      'artifacts#v1.9.0':
        download:
          - "Bugsnag.unitypackage"
    commands:
      - "features/scripts/do_size_test.sh"

  - label: "Append Unity 2021 Pipeline"
    depends_on: "build-unitypackage"
    agents:
      queue: "macos"
    timeout_in_minutes: 2
    commands:
      - "buildkite-agent pipeline upload .buildkite/unity.2021.yml"

  #
  # Conditionally trigger full pipeline
  #
  - label: "Conditionally trigger full pipeline"
    agents:
      queue: "macos"
    timeout_in_minutes: 2
    command: "sh -c .buildkite/pipeline_trigger_full.sh"
